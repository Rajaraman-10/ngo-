{% load static %}<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0; padding:0; background:#f3efe4; font-family: Arial, Helvetica, sans-serif; color:#1c1b16;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3efe4; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px; background:#ffffff; border-radius:12px; overflow:hidden;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background:#1f6b47; padding:24px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold;">Swathi</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; background:#f3efe4; font-size:12px; color:#57554a;">
              Swathi Foundation — this message relates to application
              <strong>{{ application.application_id }}</strong> in the
              {{ application.region.name }} region.
              Questions? Contact {{ org_contact_email }}.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
